name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -q weapon-showcase-forge-1.18.2.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 7.4.2
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.4.2

      - name: Build
        run: cd project/weapon-showcase-forge-1.18.2 && gradle build --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: weapon-showcase-jar
          path: project/weapon-showcase-forge-1.18.2/build/libs/*.jar
